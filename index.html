<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>GSAP Horizontal Parallax — хмари / дерева / персонажі</title>

    <!-- Swiper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

    <!-- Шрифти для попапа -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600;800&display=swap"
          rel="stylesheet">

    <style>
        :root {
            --char-drop: clamp(28px, 5vh, 72px);
            --cloud-h: 24%;
            --cloud-rise: 46vh;
            --header-h: 64px;
        }

        html, body {
            margin: 0;
            background: #0b1020;
            color: #fff;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
        }

        /* універсальна секція-фон */
        section {
            height: calc(100vh - var(--header-h));
            display: grid;
            place-items: center;
            position: relative;
            overflow: hidden;
            background: radial-gradient(1100px 520px at 30% 20%, #2a3a80 0%, #0b1020 62%);
            color: #fff;
            opacity: .95;
        }

        section::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image: radial-gradient(2px 2px at 10% 20%, #fff8 60%, transparent 61%),
            radial-gradient(2px 2px at 30% 70%, #fff8 60%, transparent 61%),
            radial-gradient(1.5px 1.5px at 60% 30%, #fff6 60%, transparent 61%),
            radial-gradient(1.5px 1.5px at 80% 60%, #fff6 60%, transparent 61%);
            background-repeat: repeat;
            background-size: 600px 400px;
            opacity: .18;
            mix-blend-mode: screen;
        }

        /* Сцена паралаксу */
        .stage {
            position: relative;
            /*    height: calc(100vh - var(--header-h));*/
            height: 100vh;
            overflow: hidden;
        }

        .layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .band {
            position: absolute;
            left: 0;
            bottom: 0;
            height: 100%;
         /*   width: 300vw;*/
            width: auto;
            min-width: 100%;
            display: flex;
            align-items: flex-end;
            will-change: transform;
        }

        .band::after {
            content: "";
            flex: 0 0 12vw;
        }

        #sky {
            z-index: 1;
        }

        #clouds {
            z-index: 2;
        }

        #trees {
            z-index: 3;
        }

        #chars {
            z-index: 4;
        }

        #sky {
            background: radial-gradient(900px 520px at 65% 10%, rgba(255, 255, 255, .18) 0%, rgba(255, 255, 255, 0) 60%),
            linear-gradient(180deg, #00E5FF 0%, #22DAFF 30%, #5FE6FF 60%, #C4F7FF 85%, #F2FEFF 100%);
        }

        #sky::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 8vh;
            transform: translateX(-50%);
            width: 70vmin;
            height: 70vmin;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 50%, #ffffff 0 10%, #fff8 10% 26%, #fff3 26% 42%, transparent 60%);
            filter: blur(18px);
            opacity: .35;
            pointer-events: none;
        }

        .stage::after {
            content: "";
            position: absolute;
            left: -5vw;
            right: -5vw;
            bottom: -6vh;
            height: 22vh;
            background: radial-gradient(120% 150% at 50% 115%, rgba(0, 0, 0, .35) 0%, rgba(0, 0, 0, .18) 38%, rgba(0, 0, 0, 0) 72%);
            pointer-events: none;
            z-index: 3;
        }

        #clouds .cloudImg {
            height: var(--cloud-h);
            width: auto;
            margin: 0 64px var(--cloud-rise);
            flex: 0 0 auto;
            opacity: .95;
            filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .10));
            transform-origin: bottom center;
            will-change: transform;
        }

        #clouds .cloudImg.sm {
            height: calc(var(--cloud-h) - 6%);
            opacity: .92;
        }

        #clouds .cloudImg.lg {
            height: calc(var(--cloud-h) + 6%);
        }

        #clouds .flip {
            transform: scaleX(-1);
        }

        #trees .treeImg {
            height: 60%;
            width: auto;
            margin: 0 48px;
            flex: 0 0 auto;
            filter: drop-shadow(0 14px 28px rgba(0, 0, 0, .30));
            transform-origin: bottom center;
        }

        #trees .treeImg.xs {
            height: 25%;
        }

        #trees .treeImg.sm {
            height: 48%;
        }

        #trees .treeImg.lg {
            height: 72%;
        }

        #trees .flip {
            transform: scaleX(-1);
        }

        .charImg {
            width: 240px;
            height: auto;
            margin: 0 120px 0;
            transform: translateY(var(--char-drop));
            filter: drop-shadow(0 12px 34px rgba(0, 0, 0, .35));
            flex: 0 0 auto;
        }

        .charImg.sm {
            width: 200px;
        }

        .charImg.lg {
            width: 280px;
        }

        .postbox-btn {
            cursor: pointer;
            pointer-events: auto;
        }

        /* обгортка для аури */
        .postbox-wrap {
            position: relative;
            display: inline-block;
            height: 25%;
        }

        /* дві хвилі: внутрішнє світіння та зовнішній пульс */
        .postbox-wrap::before,
        .postbox-wrap::after {
            content: "";
            position: absolute;
            inset: -8%;
            border-radius: 50%;
            pointer-events: none;
        }

        /* м’яке постійне світіння */
        .postbox-wrap::before {
            background: radial-gradient(closest-side, #ff3b3b88 0%, #ff3b3b33 45%, transparent 70%);
            filter: blur(2px);
            animation: glow 2.4s ease-in-out infinite;
        }

        /* кільце, що розширюється */
        .postbox-wrap::after {
            border: 3px solid #ff7a00;
            box-shadow: 0 0 18px #ff7a00;
            opacity: .0;
            transform: scale(.8);
            animation: ring 1.6s ease-out infinite;
        }

        /* легкий підскок самої іконки, щоб привертати увагу */
        .postbox-wrap > img {
            animation: floaty 3.2s ease-in-out infinite;
            will-change: transform;
        }

        /* підсилюємо при ховері/фокусі */
        .postbox-wrap:hover::before {
            filter: blur(3px);
        }

        .postbox-wrap:hover::after {
            box-shadow: 0 0 22px #ff9b2a;
        }

        .postbox-wrap:hover > img {
            animation-duration: 2.2s;
        }

        /* ключові кадри */
        @keyframes glow {
            0%, 100% {
                opacity: .55;
                transform: scale(1);
            }
            50% {
                opacity: .85;
                transform: scale(1.04);
            }
        }

        @keyframes ring {
            0% {
                opacity: .65;
                transform: scale(.85);
            }
            80% {
                opacity: 0;
                transform: scale(1.25);
            }
            100% {
                opacity: 0;
                transform: scale(1.25);
            }
        }

        @keyframes floaty {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-6px) rotate(-1deg);
            }
        }

        /*правки (додати більше неба і зафіксувати лого */

        /* трохи «неба» зверху у першій сцені */
      /*  #stage { --sky-top-space: clamp(40px, 1vh, 180px); }*/

        /* зсуваємо всі паралакс-стрічки сцени #stage вниз на однакову величину */
        #skyBand     { transform: translateY(var(--sky-top-space)); }
        #cloudsBand  { transform: translateY(calc(var(--sky-top-space) * 0.6)); }
        #treesBand   { transform: translateY(calc(var(--sky-top-space) * 0.15)); } /* за бажанням: 0 */

        /* піднімаємо героїв у ПЕРШІЙ сцені (щоб не обрізались) */
        #stage { --char-drop: clamp(12px, 3vh, 40px); }

        /* логотип у небі (поверх шарів) */
        .stage-logo{
            position: absolute;
            top: calc(var(--header-h) + 8px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 6;                /* вище за #chars (z-index:4) і псевдо-тінь сцени (z-index:3) */
            pointer-events: none;      /* щоб не заважав свайпам/клікам */
        }
        .stage-logo img{
            width: clamp(140px, 32vw, 360px);
            height: auto;
            display: block;
            filter: drop-shadow(0 6px 14px rgba(0,0,0,.25));
        }



        /* ======= COMIC POPUP (твій, без змін у розмітці) ======= */
        .pc-backdrop[hidden], .pc-root[hidden] {
            display: none !important;
        }

        .pc-backdrop {
            position: fixed;
            inset: 0;
            z-index: 9998;
            background: rgba(0, 0, 0, .18);
            -webkit-tap-highlight-color: transparent;
        }

        .pc-root {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(.92) rotate(-0.6deg);
            z-index: 9999;
            width: min(540px, 80vw);
            max-height: 95vh;
            overflow: auto;
            border: 2px solid #111;
            border-radius: 24px;
            background: radial-gradient(circle at 2px 2px, rgba(255, 38, 74, .35) 1.6px, transparent 1.7px) 0 0/8px 8px,
            radial-gradient(circle at 4px 4px, rgba(18, 82, 255, .28) 1.4px, transparent 1.5px) 0 0/8px 8px,
            #ffe977;
            color: #111;
            font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
            padding: 22px 18px 20px;
            opacity: 0;
            pointer-events: none;
            transition: transform .28s cubic-bezier(.2, .8, .2, 1), opacity .22s ease;
        }

        .pc-root.pc--visible {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1) rotate(-0.6deg);
        }

        @media (min-width: 1024px) {
            .pc-root {
                width: min(50vw, 720px);
                box-shadow: 12px 12px 0 #111;
                border: 5px solid #111;
                max-height: 82vh;
            }

            .pc-sub {
                display: block;
            }
        }

        .pc-root::before {
            content: "";
            position: absolute;
            inset: 8px;
            border-radius: 18px;
            z-index: 0;
            pointer-events: none;
            background: repeating-linear-gradient(135deg,
            #ff1744 0 12px, #fff 12px 18px, #1e3aff 18px 28px, #fff 28px 34px, #ffd400 34px 44px, #fff 44px 50px);
            mix-blend-mode: multiply;
            opacity: .18;
        }

        .pc-header {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            position: relative;
            z-index: 1;
        }

        .pc-title {
            margin: 0;
            font-family: "Bangers", cursive;
            letter-spacing: .6px;
            font-size: 40px;
            line-height: 1;
            color: #111;
            text-shadow: 2px 2px 0 #fff, 5px 5px 0 #111;
        }

        .pc-burst {
            margin-left: auto;
            transform: rotate(7deg);
            background: #ffd400;
            color: #111;
            border: 4px solid #111;
            border-radius: 999px;
            font-family: "Bangers", cursive;
            font-size: 18px;
            padding: 6px 10px;
            box-shadow: 6px 6px 0 #111;
        }

        .pc-close {
            margin-left: 10px;
            width: 42px;
            height: 42px;
            flex: 0 0 42px;
            display: grid;
            place-items: center;
            cursor: pointer;
            border: 4px solid #111;
            border-radius: 50%;
            background: #fff;
            box-shadow: 5px 5px 0 #111;
            font-weight: 800;
            font-family: "Bangers", cursive;
            font-size: 20px;
        }

        .pc-sub {
            display: none;
            margin: 8px 2px 12px;
            font-weight: 600;
            color: #222;
            z-index: 1;
            position: relative;
        }

        .pc-form {
            display: grid;
            grid-template-columns:1fr 1fr;
            gap: 12px;
            z-index: 1;
            position: relative;
        }

        .pc-full {
            grid-column: 1 / -1;
        }

        .pc-field {
            display: grid;
            gap: 6px;
        }

        .pc-label {
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .5px;
            font-size: 12px;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .pc-tag {
            border: 3px solid #111;
            background: #fff;
            padding: 0 8px;
            border-radius: 999px;
            box-shadow: 3px 3px 0 #111;
            font-weight: 800;
            font-size: 11px;
        }

        .pc-input, .pc-textarea {
            border: 3px solid #111;
            border-radius: 14px;
            background: #fff;
            padding: 12px 14px;
            font-size: 15px;
            outline: none;
            color: #111;
            box-shadow: 4px 4px 0 #111;
        }

        .pc-textarea {
            min-height: 120px;
            resize: vertical;
        }

        .pc-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .pc-check {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            border: 3px solid #111;
            border-radius: 12px;
            padding: 8px 10px;
            background: #fff;
            box-shadow: 4px 4px 0 #111;
        }

        .pc-actions {
            margin-top: 6px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .pc-btn {
            border: 3px solid #111;
            border-radius: 14px;
            padding: 12px 16px;
            cursor: pointer;
            box-shadow: 4px 4px 0 #111;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .pc-btn.pc-primary {
            background: #ff1744;
            color: #fff;
        }

        .pc-btn.pc-secondary {
            background: #fff;
            color: #111;
            box-shadow: 4px 4px 0 #111, 0 0 0 3px inset;
        }

        @media (max-width: 640px) {
            .pc-form {
                grid-template-columns:1fr;
            }

            .pc-title {
                font-size: 34px;
            }
        }

        @media (prefers-reduced-motion: no-preference) {
            .pc-root {
                transform-origin: center;
                will-change: transform;
            }

            .pc-root.pc--shaking {
                animation: pc-shake 520ms cubic-bezier(.18, .88, .26, 1.12) 1;
            }

            @keyframes pc-shake {
                0% {
                    transform: translate(-50%, -50%) scale(1) rotate(-0.6deg);
                }
                15% {
                    transform: translate(calc(-50% + 2px), calc(-50% + 1px)) rotate(-1.2deg) scale(1.01);
                }
                30% {
                    transform: translate(calc(-50% - 2px), calc(-50% - 1px)) rotate(0.2deg) scale(.995);
                }
                45% {
                    transform: translate(calc(-50% + 1px), calc(-50% - 2px)) rotate(-0.9deg) scale(1.008);
                }
                60% {
                    transform: translate(calc(-50% - 1px), calc(-50% + 2px)) rotate(-0.2deg) scale(.998);
                }
                75% {
                    transform: translate(calc(-50% + .5px), calc(-50% + .5px)) rotate(-0.7deg) scale(1.004);
                }
                100% {
                    transform: translate(-50%, -50%) scale(1) rotate(-0.6deg);
                }
            }
        }

        /* ======= PHONE SECTION (100vh) ======= */
        .phone-section {
            height: 100vh; /* фіксована висота */
            display: grid;
            place-items: center;
            position: relative;
            overflow: hidden;
            background: radial-gradient(1100px 520px at 60% 10%, #2a115a 0%, #0b1020 62%);
        }

        .phone-wrap {
            position: relative;
            width: min(250px, 80vw); /* трохи менший телефон */
        }

        /* рука під телефоном */
        .hand {
            position: absolute;
            left: 50%;
            bottom: -35%;
            transform: translateX(-50%) scale(0.92);
            width: 150%;
            filter: drop-shadow(0 10px 16px rgba(0, 0, 0, .35));
            z-index: 1;
            pointer-events: none;
        }

        /* каркас телефону (під екраном за z-index) */
        .phone-frame {
            position: relative;
            z-index: 1;
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 18px 38px rgba(0, 0, 0, .35));
            pointer-events: none;
        }

        /* екран зверху, щоб його не перекривав svg-фрейм */
        .phone-screen {
            --screen-top: 9%;
            --screen-left: 7.5%;
            --screen-w: 85%;
            --screen-h: 82%;

            position: absolute;
            top: var(--screen-top);
            left: var(--screen-left);
            width: var(--screen-w);
            height: var(--screen-h);
            overflow: hidden;
            border-radius: 24px;
            z-index: 2;
            /* на випадок, якщо зображення не знайдуться, бачиш фон */
            background: #0b0b0b;
        }

        .phone-screen .swiper,
        .phone-screen .swiper-wrapper,
        .phone-screen .swiper-slide {
            width: 100%;
            height: 100%;
        }

        .phone-screen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ======= BILLBOARD ======= */
        /* ======= BILLBOARD (з твоєю bigboard.svg) ======= */
        .billboard-section {
            position: relative;
            background: yellow;
            place-items: normal;
            align-content: flex-end;
            /*min-height: 60vh;*/
            /*  height: auto;*/
        }


        /* сам білборд як картинка-рамка */
        .billboard {
            width: min(980px, 92vw);
            margin: 0 auto;
            position: relative;
            /* bigboard.svg — твоя рамка */
            background: url("./assets/bigboard.svg") center/contain no-repeat;
            aspect-ratio: 16/9; /* загальний розмір рамки */
            filter: drop-shadow(0 18px 60px rgba(0, 0, 0, .45));
        }

        .billboard {
            will-change: transform;
        }

        /* ВНУТРІШНІЙ “ЕКРАН” у рамці.
           Підіграй ці 4 значення під прозоре «вікно» в bigboard.svg */
        .billboard-screen {
            position: absolute;
            /* координати та розмір екрану усередині рамки: */
            left: 12.5%;
            top: 15%;
            width: 75%;
            height: 70%;
            border-radius: 14px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .35) inset;
        }

        .billboard-screen iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        @media (max-width: 720px) {
            .billboard-section {
                height: 30vh;
            }
        }


        /* === CHARACTER (Gorilla) SECTION === */
        .character-section {
            min-height: 92vh;
            display: grid;
            align-content: flex-end;
            position: relative;
            overflow: hidden;
            background: greenyellow;
        }

        /* розміщення героя */
        .char-wrap {
            position: relative;
            display: grid;
            place-items: center;
            width: min(900px, 92vw);
        }

        .char-img {
            width: min(600px, 64vw);
            filter: drop-shadow(0 16px 34px rgba(0, 0, 0, .45));
            transform-origin: 50% 90%;
        }

        /* коміксна бабла */
        .bubble {
            position: absolute;
            left: 58%;
            top: 6%;
            transform: translateX(-10%) rotate(-1.2deg);
            pointer-events: none;
        }

        .bubble-inner {
            position: relative;
            background: #fff;
            color: #111;
            border: 6px solid #111;
            border-radius: 24px;
            padding: 18px 22px 16px 20px;
            box-shadow: 10px 10px 0 #111;
            font-family: "Bangers", cursive;
            font-size: clamp(26px, 4vw, 40px);
            letter-spacing: .6px;
            line-height: 1.05;
            min-width: 320px;
            max-width: min(520px, 70vw);
        }

        /* «хвостик» */
        .bubble-tail {
            position: absolute;
            width: 88px;
            height: 58px;
            left: 12%;
            bottom: -40px;
            transform: rotate(14deg);
        }

        /* курсор-каретка */
        .caret {
            display: inline-block;
            width: .6ch;
            height: 1em;
            transform: translateY(.1em);
            background: #111;
            margin-left: .2ch;
            animation: caretBlink 0.9s steps(1) infinite;
        }

        @keyframes caretBlink {
            50% {
                opacity: 0;
            }
        }

        /* легка «аура» від бабла */
        .bubble-inner::after {
            content: "";
            position: absolute;
            inset: -10px;
            border-radius: 22px;
            background: radial-gradient(circle at 50% 50%, #ffd40055 0 40%, transparent 60%);
            z-index: -1;
            filter: blur(6px);
        }

        /* адаптив: на вузьких екранах баблу вище/по центру */
        @media (max-width: 720px) {
            .bubble {
                left: 50%;
                top: -6%;
                transform: translate(-50%, 0) rotate(-2deg);
            }
        }

        /* === CHARACTER 2 (jumper) === */
        .character2-section {
            min-height: 92vh;
            display: grid;
            align-content: flex-end;
            position: relative;
            overflow: hidden;
            background: springgreen;
        }

        .char2-wrap {
            position: relative;
            display: grid;
            place-items: center;
            width: min(900px, 92vw);
        }

        /* сам персонаж — торкається низу секції */
        .char2-img {
            width: min(560px, 60vw);
            transform-origin: 50% 100%;
            filter: drop-shadow(0 16px 34px rgba(0, 0, 0, .45));
        }

        /* еліптична тінь на «землі» */
        .char2-shadow {
            position: absolute;
            bottom: 2.2vh;
            width: clamp(180px, 42vw, 520px);
            height: clamp(28px, 5vw, 50px);
            border-radius: 999px;
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, .45) 0%, rgba(0, 0, 0, .22) 40%, rgba(0, 0, 0, 0) 70%);
            filter: blur(2px);
            z-index: -1;
        }

        /* Бабл для character2 (праворуч від голови) */
        /* === Bubble character2: праворуч від голови === */
        .character2-section .bubble2 {
            position: absolute;

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
<script>
    gsap.registerPlugin(ScrollTrigger);

    // === довжина сцени: desktop як було, mobile — довше ===
    function stageScrollEnd(){
        // десктоп — як було
        if (!window.matchMedia('(max-width:780px)').matches) return "+=3050";

        // ширина доріжки з персонажами у px (≈ 300vw)
        const w = window.innerWidth;
        const charsW = document.getElementById('charsBand')?.scrollWidth || Math.round(w * 3);

        // скільки треба «проїхати», щоб показати ВСЕ: (ширина доріжки - ширина екрана)
        let fullSpan = Math.max(charsW - w, Math.round(w * 2.4)); // запас якщо scrollWidth не віддався
        console.log(fullSpan);

        // множимо, щоб швидкість була комфортна і точно доїхали до поштової скриньки
        return "+=" + Math.round(fullSpan * 1.8); // за потреби підніми 1.6 → 1.8
    }


    // функція: повний зсув для конкретної стрічки (scrollWidth - ширина екрана)
    const getShift = (sel, k = 1) => {
        const el = document.querySelector(sel);
        if (!el) return 0;

<script>
    // свайп по сцені #stage: ліворуч = скрол вниз (вперед), праворуч = скрол вгору (назад)
    (function(){
        if (!window.matchMedia('(max-width:780px)').matches) return;

        const stage = document.getElementById('stage');
        let x0 = null, y0 = null;

        function headerH(){
            const h = document.getElementById('siteHeader');
            return h ? Math.round(h.getBoundingClientRect().height) : 0;
        }

        function start(e){
            const t = e.touches && e.touches[0]; if(!t) return;
            x0 = t.clientX; y0 = t.clientY;
        }
        function end(e){
            if (x0==null) return;
            const t = (e.changedTouches && e.changedTouches[0]) || e.touches?.[0];
            if(!t){ x0=y0=null; return; }

            const dx = t.clientX - x0;
            const dy = Math.abs(t.clientY - y0 || 0);

            // жест саме горизонтальний
            if (Math.abs(dx) > 40 && Math.abs(dx) > dy * 1.2){
                const ST = ScrollTrigger.getById('stageParallax');
                const curr = window.scrollY;
                const step = Math.max(innerHeight*0.45, Math.min(innerHeight*0.9, Math.abs(dx)*8));

                // НОВА логіка: ліворуч (dx < 0) — вниз/вперед, праворуч — вгору/назад
                const delta = dx < 0 ? step : -step;
                let target = curr + delta;

                // Якщо просимося «далі за кінець» сцени свайпом ліворуч — переходимо на наступну секцію
                if (dx < 0 && curr >= (ST.end - 4)) {
                    gsap.to(window, {
                        duration: 0.65,
                        ease: "power2.out",
                        scrollTo: { y: "#phone", offsetY: headerH() }
                    });
                } else {
                    target = gsap.utils.clamp(ST.start, ST.end, target);
                    gsap.to(window, { duration:.55, ease:"power2.out", scrollTo: target });
                }
            }
            x0 = y0 = null;
        }

        stage.addEventListener('touchstart', start, {passive:true});
        stage.addEventListener('touchend',   end,   {passive:true});
    })();
</script>

<script>
    gsap.registerPlugin(ScrollToPlugin, ScrollTrigger);

    // додай після registerPlugin(...)
    gsap.config({nullTargetWarn: false});

    // хелпер — увімкнути active на потрібному пункті
    function setActiveById(id) {
        document.querySelectorAll('.nav-link').forEach(a => {
            const target = a.dataset.target || a.getAttribute('href');
            a.classList.toggle('active', target === id);
        });
    }

    // висота хедера
    const header = document.getElementById('siteHeader');
    const headerH = () => Math.round(header.getBoundingClientRect().height);

    // тримаємо CSS-змінну в синхроні
    function syncHeaderVar() {
        document.documentElement.style.setProperty('--header-h', headerH() + 'px');
    }

    syncHeaderVar();
    addEventListener('resize', () => {
        syncHeaderVar();
        ScrollTrigger.refresh();
    });

    // плавний скрол + миттєве підсвічування
    document.querySelectorAll('.nav-link').forEach(a => {
        a.addEventListener('click', (e) => {
            e.preventDefault();
            const sel = a.dataset.target || a.getAttribute('href');
            setActiveById(sel); // підсвітити одразу
            gsap.to(window, {
                duration: 0.8,
                ease: 'power2.out',
                scrollTo: {y: sel, offsetY: headerH()}
            });
        });
    });
    document.querySelector('.logo')?.addEventListener('click', (e) => {
        e.preventDefault();
        setActiveById('#stage');
        gsap.to(window, {
            duration: 0.8,
            ease: 'power2.out',
            scrollTo: {y: '#stage', offsetY: headerH()}
        });
    });

    // секції для спостереження
    const sections = ['#stage', '#phone', '#gorilla', '#char-2', '#billboard', '#faq'];

    // головний горизонтальний паралакс — додай anticipatePin, щоб інші тригери не «глючили»


    // підсвічування активного пункту у процесі скролу
    // --- НАЙСТАБІЛЬНІШИЙ СПОСІБ АКТИВУ ---
    // що впритул під хедером – те активне (незалежно від pin/transform)

    const SECTIONS = ['#stage', '#phone', '#gorilla', '#char-2', '#billboard', '#faq'];
    let currentActive = null;
    let rafRunning = false;

    function updateActive() {
        rafRunning = false;
        const y = headerH();             // "лінія перевірки" – низ хедера
        const hysteresis = 10;           // щоб не тремтіло на межі

        let winner = null;

        for (const id of SECTIONS) {
            const el = document.querySelector(id);
            if (!el) continue;
            const r = el.getBoundingClientRect();

            // активна секція: її top <= лінія, а bottom > лінії (з невеликим гістерезисом)
            if (r.top <= y + hysteresis && r.bottom > y + hysteresis) {
                winner = id;
                break;
            }
        }

        // Якщо жодна не перекриває лінію (наприклад, інерція скролу),
        // вибираємо ту, чий top найближчий до лінії знизу/зверху.
        if (!winner) {
            let bestDist = Infinity;
            for (const id of SECTIONS) {
                const r = document.querySelector(id).getBoundingClientRect();
                const dist = Math.abs(r.top - y);
                if (dist < bestDist) {
                    bestDist = dist;
                    winner = id;
                }
            }
        }

        if (winner && winner !== currentActive) {
            currentActive = winner;
            setActiveById(winner);
        }
    }

    // тротлимо скрол: рахуємо один раз на кадр
    function onScroll() {
        if (!rafRunning) {
            rafRunning = true;
            requestAnimationFrame(updateActive);
        }
    }

    addEventListener('scroll', onScroll, {passive: true});
    addEventListener('resize', () => {
        syncHeaderVar();
        updateActive();
    });

    // ініціалізація
    addEventListener('load', () => {
        updateActive();
        ScrollTrigger.refresh(); // залишаємо для GSAP-анімацій
    });


    // стартова ініціалізація під новий підхід
    addEventListener('load', () => {
        const hash = window.location.hash;
        // якщо відкрились одразу з #якорем — доскролимо з відступом під хедер
        if (hash && document.querySelector(hash)) {
            gsap.set(window, {scrollTo: {y: hash, offsetY: headerH(), autoKill: false}});
        }
        updateActive();          // порахувати й підсвітити актуальний пункт
        ScrollTrigger.refresh(); // для GSAP-анімацій
    });


</script>

<script>
    (function () {
        const trigger = document.getElementById('postbox'); // поштовий ящик
        const popup = document.getElementById('pc-popup');
        const backdrop = document.getElementById('pc-backdrop');
        const closeBtn = document.getElementById('pc-close');
        const navToggleEl = document.getElementById('navToggle');
        let lastFocus;

        function hideHeaderForPopup(){
            document.documentElement.classList.add('popup-open');
            // закриємо бургер, якщо був відкритий
            document.documentElement.classList.remove('nav-open');
            navToggleEl?.setAttribute('aria-expanded','false');
        }
        function showHeaderAfterPopup(){
            document.documentElement.classList.remove('popup-open');
        }

        const open = () => {
            lastFocus = document.activeElement;
            backdrop.hidden = false;
            popup.hidden = false;
            requestAnimationFrame(() => {
                popup.classList.add('pc--visible');
                popup.classList.add('pc--shaking');
                setTimeout(() => popup.classList.remove('pc--shaking'), 550);
            });
            document.body.style.overflow = 'hidden';
            setTimeout(() => document.getElementById('pc-name')?.focus(), 60);
            hideHeaderForPopup();
            pcConfetti();
        };
        const close = () => {
            popup.classList.remove('pc--visible');
            document.body.style.overflow = '';
            setTimeout(() => {
                popup.hidden = true;
                backdrop.hidden = true;
                showHeaderAfterPopup();
                lastFocus && lastFocus.focus?.();
            }, 200);
        };

        trigger?.addEventListener('click', open);
        backdrop?.addEventListener('click', close);
        closeBtn?.addEventListener('click', close);
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && !popup.hidden) close();
        });
    })();

    function pcConfetti(durationMs = 800, count = 180) {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

        const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        const canvas = document.createElement('canvas');
        canvas.className = 'pc-confetti';
        Object.assign(canvas.style, {position: 'fixed', inset: '0', zIndex: '10000', pointerEvents: 'none'});
        document.body.appendChild(canvas);

        const ctx = canvas.getContext('2d');
        const resize = () => {
            canvas.width = Math.floor(innerWidth * dpr);
            canvas.height = Math.floor(innerHeight * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        };
        resize();
        addEventListener('resize', resize, {passive: true});

        const colors = ['#ff1744', '#ffd400', '#1e3aff', '#00e5ff', '#111'];
        const shapes = ['rect', 'circle', 'tri'];
        const rand = (a, b) => a + Math.random() * (b - a);
        const pick = arr => arr[(Math.random() * arr.length) | 0];

        const cx = innerWidth / 2, cy = innerHeight / 2;
        const parts = Array.from({length: count}, () => {
            const angle = rand(0, Math.PI * 2);
            const speed = rand(2.2, 6.2);
            return {
                x: cx + Math.cos(angle) * rand(0, 40),
                y: cy + Math.sin(angle) * rand(0, 20),
                vx: Math.cos(angle) * speed + rand(-0.6, 0.6),
                vy: Math.sin(angle) * speed - rand(2.0, 4.0),
                g: rand(0.06, 0.18),
                w: rand(6, 12), h: rand(8, 16),
                r: rand(0, Math.PI * 2), vr: rand(-0.2, 0.2),
                color: pick(colors), shape: pick(shapes),
                life: rand(0.8, 1)
            };
        });

        const start = performance.now();
        (function frame(now) {
            const t = now - start;
            ctx.clearRect(0, 0, innerWidth, innerHeight);

            for (const p of parts) {
                p.vy += p.g;
                p.x += p.vx;
                p.y += p.vy;
                p.r += p.vr;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.r);

                const fade = 1 - Math.min(1, t / durationMs) * (1 - p.life);
                ctx.globalAlpha = Math.max(0, fade);
                ctx.fillStyle = p.color;

                switch (p.shape) {
                    case 'rect':
                        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                        break;
                    case 'circle':
                        ctx.beginPath();
                        ctx.arc(0, 0, Math.min(p.w, p.h) / 2, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    case 'tri':
                        ctx.beginPath();
                        ctx.moveTo(0, -p.h / 2);
                        ctx.lineTo(-p.w / 2, p.h / 2);
                        ctx.lineTo(p.w / 2, p.h / 2);
                        ctx.closePath();
                        ctx.fill();
                        break;
                }
                ctx.restore();
            }

            if (t < durationMs) {
                requestAnimationFrame(frame);
            } else {
                removeEventListener('resize', resize);
                canvas.remove();
            }
        })(start);
    }
</script>

    // закривати після кліку на пункт меню (і зберегти плавний скрол)
    document.querySelectorAll('.main-nav .nav-link').forEach(a => {
        a.addEventListener('click', () => closeNav(), {capture: true});
    });

    // Esc — закрити
    addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeNav();
    });

    // при ресайзі на десктоп — прибираємо відкритий стан
    addEventListener('resize', () => {
        if (window.matchMedia('(min-width: 781px)').matches) closeNav();
    });
</script>

</body>
</html>
